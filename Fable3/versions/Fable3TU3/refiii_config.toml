# ReXGlue config for the Fable 3 USA / Europe executable with title update 3 applied (disc media ID
# D99E18E7, executable 0.0.3.3; the update is TU_16L626M_000000C000000.00000000000O3).
#
# The same entries as Fable3/versions/Fable3, each at its TU3 address: the update is a full relink,
# so no address is shared. Every address here was matched in the TU3 IDB (default.xex.i64 under
# Fable 3/tu3, labelled from the disc IDB: each matched function's comment names its disc address),
# and every [[midasm_hook]] site was compared instruction by instruction with the disc's. Where TU3
# changed a hook site the entry says so. The hooks bind by the names, so the same hook sources
# compile against either config.
#
# Size corrections the disc config carries for code TU3 rewrote or dropped are not carried; the
# first generator run on this executable reports what it still needs, as the disc's did.

